<style>
    .mf-app-topbar {
        position: sticky;
        top: 0;
        z-index: 50;
        flex: 0 0 auto;
        background: color-mix(in srgb, var(--brand-secondary, #07111F) 94%, #000 6%);
        border-bottom: 1px solid color-mix(in srgb, var(--brand-primary, #00D4FF) 18%, transparent);
        backdrop-filter: blur(16px);
    }

    .mf-app-topbar-inner {
        width: min(100%, 1480px);
        min-height: 68px;
        margin: 0 auto;
        padding: 10px 22px;
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        align-items: center;
        gap: 18px;
    }

    .mf-app-brand {
        display: inline-flex;
        align-items: center;
        color: var(--text, #F4FAFF);
        text-decoration: none;
        transition: opacity .18s ease, transform .18s ease;
    }

    .mf-app-brand:hover {
        opacity: .88;
        transform: translateY(-1px);
    }

    .mf-app-logo {
        display: block;
        width: auto;
        max-width: min(190px, 34vw);
        height: 44px;
        object-fit: contain;
    }

    .mf-app-nav {
        min-width: 0;
        display: flex;
        align-items: center;
        gap: 6px;
        overflow-x: auto;
        scrollbar-width: thin;
    }

    .mf-app-nav-link {
        height: 36px;
        display: inline-flex;
        align-items: center;
        padding: 0 12px;
        border-radius: 8px;
        color: var(--muted, #8FA7C0);
        font-size: 13px;
        font-weight: 800;
        text-decoration: none;
        white-space: nowrap;
        transition: color .18s ease, background .18s ease, border-color .18s ease;
    }

    .mf-app-nav-link:hover,
    .mf-app-nav-link.is-active {
        color: var(--text, #F4FAFF);
        background: color-mix(in srgb, var(--brand-primary, #00D4FF) 9%, transparent);
    }

    .mf-app-nav-group { position: relative; }

    .mf-app-nav-dropdown,
    .mf-app-user-dropdown {
        position: absolute;
        top: calc(100% + 8px);
        z-index: 70;
        display: none;
        min-width: 180px;
        padding: 6px;
        border: 1px solid color-mix(in srgb, var(--brand-primary, #00D4FF) 18%, transparent);
        border-radius: 8px;
        background: #0B1726;
        box-shadow: 0 16px 32px rgba(0, 0, 0, .24);
    }

    .mf-app-nav-dropdown { left: 0; }

    .mf-app-nav-group:hover .mf-app-nav-dropdown,
    .mf-app-nav-group:focus-within .mf-app-nav-dropdown,
    .mf-app-user-menu:hover .mf-app-user-dropdown,
    .mf-app-user-menu:focus-within .mf-app-user-dropdown {
        display: grid;
        gap: 3px;
    }

    .mf-app-nav-dropdown a,
    .mf-app-user-dropdown a {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 9px 10px;
        border-radius: 6px;
        color: var(--muted, #8FA7C0);
        font-size: 12px;
        font-weight: 850;
        text-decoration: none;
    }

    .mf-app-nav-dropdown a:hover,
    .mf-app-user-dropdown a:hover {
        color: var(--text, #F4FAFF);
        background: color-mix(in srgb, var(--brand-primary, #00D4FF) 9%, transparent);
    }

    .mf-app-user-menu {
        position: relative;
        justify-self: end;
    }

    .mf-app-user-trigger {
        height: 46px;
        display: grid;
        grid-template-columns: 34px minmax(0, 1fr) auto;
        align-items: center;
        gap: 9px;
        min-width: 190px;
        max-width: 270px;
        padding: 0 10px;
        border: 1px solid color-mix(in srgb, var(--brand-primary, #00D4FF) 16%, transparent);
        border-radius: 8px;
        color: var(--text, #F4FAFF);
        background: #0B1726;
        font: inherit;
        text-align: left;
        cursor: pointer;
    }

    .mf-app-avatar {
        width: 34px;
        height: 34px;
        display: grid;
        place-items: center;
        border-radius: 8px;
        color: var(--brand-primary, #00D4FF);
        background: color-mix(in srgb, var(--brand-primary, #00D4FF) 14%, transparent);
        font-size: 12px;
        font-weight: 950;
    }

    .mf-app-user-copy { min-width: 0; }

    .mf-app-user-name,
    .mf-app-user-restaurant {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    .mf-app-user-name {
        font-size: 13px;
        font-weight: 850;
    }

    .mf-app-user-restaurant {
        margin-top: 2px;
        color: var(--low, #5B789A);
        font-size: 11px;
        font-weight: 700;
    }

    .mf-app-chevron {
        color: var(--brand-primary, #00D4FF);
        font-size: 14px;
    }

    .mf-app-user-dropdown {
        right: 0;
        width: 230px;
    }

    .mf-app-dropdown-block { padding: 8px 10px; }

    .mf-app-dropdown-label {
        color: var(--low, #5B789A);
        font-size: 10px;
        font-weight: 900;
        letter-spacing: .08em;
        text-transform: uppercase;
    }

    .mf-app-dropdown-value {
        margin-top: 3px;
        overflow: hidden;
        color: var(--text, #F4FAFF);
        font-size: 12px;
        font-weight: 850;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    .mf-app-logout { color: var(--brand-primary, #00D4FF) !important; }

    @media (max-width: 1120px) {
        .mf-app-topbar-inner {
            grid-template-columns: auto minmax(0, 1fr);
            gap: 8px 14px;
        }

        .mf-app-nav {
            grid-column: 1 / -1;
            grid-row: 2;
            padding-bottom: 2px;
        }

        .mf-app-user-menu {
            grid-column: 2;
            grid-row: 1;
        }
    }

    @media (max-width: 620px) {
        .mf-app-topbar-inner { padding: 9px 14px; }
        .mf-app-logo {
            max-width: min(156px, 42vw);
            height: 40px;
        }
        .mf-app-user-trigger {
            min-width: 44px;
            width: 44px;
            padding: 0 4px;
            grid-template-columns: 34px;
        }
        .mf-app-user-copy,
        .mf-app-chevron { display: none; }
    }
</style>
