<div style="
display:flex;
align-items:center;
gap:12px;
overflow:auto;
padding-bottom:4px;
">

    <!-- TODO -->

    <button style="
    background:#00D4FF;
    color:black;
    border:none;
    border-radius:14px;
    padding:12px 18px;
    font-weight:700;
    cursor:pointer;
    white-space:nowrap;
    ">
        ⭐ Todo
    </button>

    <!-- CATEGORIES -->

    {% for category in categories %}

    <button style="
    background:#0B1726;
    color:#8FA7C0;
    border:1px solid rgba(255,255,255,.06);
    border-radius:14px;
    padding:12px 18px;
    font-weight:600;
    cursor:pointer;
    white-space:nowrap;
    transition:.2s;
    ">

        {% if category.icon %}
            {{ category.icon }}
        {% else %}
            🍽️
        {% endif %}

        {{ category.name }}

    </button>

    {% endfor %}

</div>
