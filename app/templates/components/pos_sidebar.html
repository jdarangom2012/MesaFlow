<aside style="
width:210px;
background:#0B1726;
border-right:1px solid rgba(0,212,255,.10);
display:flex;
flex-direction:column;
justify-content:space-between;
">

    <div style="padding:18px;">

        <div style="display:flex;align-items:center;gap:10px;margin-bottom:28px;">
            <div style="
            width:36px;
            height:36px;
            border-radius:10px;
            background:#111C2D;
            border:1px solid rgba(0,212,255,.25);
            display:flex;
            align-items:center;
            justify-content:center;
            color:#00D4FF;
            font-weight:bold;
            ">
                M
            </div>

            <div>
                <div style="font-weight:800;color:white;">
                    Mesa<span style="color:#00D4FF;">Flow</span>
                </div>
                <div style="font-size:10px;color:#5B789A;letter-spacing:.15em;">
                    LA PIAZZA
                </div>
            </div>
        </div>

        <div style="display:flex;flex-direction:column;gap:10px;">

            <div style="background:rgba(0,212,255,.12);color:#00D4FF;padding:14px;border-radius:12px;text-align:center;">
                ▦<br>POS
            </div>

            <div style="color:#5B789A;padding:14px;border-radius:12px;text-align:center;">
                ◷<br>Mesas
            </div>

            <div style="color:#5B789A;padding:14px;border-radius:12px;text-align:center;">
                ▣<br>Pedidos
            </div>

            <div style="color:#5B789A;padding:14px;border-radius:12px;text-align:center;">
                ⌂<br>Cocina
            </div>

            <div style="color:#5B789A;padding:14px;border-radius:12px;text-align:center;">
                ▬<br>Pagos
            </div>

            <div style="color:#5B789A;padding:14px;border-radius:12px;text-align:center;">
                ⌁<br>Reportes
            </div>

        </div>

    </div>

    <div style="padding:14px;border-top:1px solid rgba(0,212,255,.10);">

        <div style="font-size:10px;color:#243852;letter-spacing:.15em;text-align:center;margin-bottom:10px;">
            MESAS
        </div>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:7px;">

            {% for table in tables %}

            <div
            class="pos-table-option"
            data-table-id="{{ table.id }}"
            style="
            background:rgba(0,212,255,.08);
            border:1px solid rgba(0,212,255,.22);
            color:#00D4FF;
            padding:10px;
            border-radius:10px;
            text-align:center;
            font-size:12px;
            font-weight:bold;
            ">
                {{ table.name }}
            </div>

            {% endfor %}

        </div>

    </div>

</aside>
