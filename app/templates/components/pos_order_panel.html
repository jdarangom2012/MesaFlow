<aside style="
width:360px;
background:#0B1726;
border-left:1px solid rgba(255,255,255,.06);
display:flex;
flex-direction:column;
">

    <!-- HEADER -->

    <div style="
    padding:22px;
    border-bottom:1px solid rgba(255,255,255,.06);
    ">

        <div style="
        display:flex;
        align-items:center;
        justify-content:space-between;
        ">

            <div style="
            font-size:24px;
            font-weight:800;
            color:white;
            ">

                Orden Actual

            </div>

            <div
            id="pos-cart-count"
            style="
            background:rgba(0,212,255,.12);
            border:1px solid rgba(0,212,255,.20);
            color:#00D4FF;
            border-radius:999px;
            padding:8px 12px;
            font-size:12px;
            font-weight:700;
            ">

                0 ITEMS

            </div>

        </div>

    </div>

    <!-- ITEMS -->

    <div
    id="pos-cart-items"
    style="
    flex:1;
    overflow:auto;
    padding:18px;
    ">
        <div id="pos-cart-empty" style="
        color:#6D87A8;
        font-size:14px;
        text-align:center;
        margin-top:32px;
        ">
            Selecciona productos para iniciar la orden.
        </div>

    </div>

    <!-- TOTALS -->

    <div style="
    padding:22px;
    border-top:1px solid rgba(255,255,255,.06);
    ">

        <!-- SUBTOTAL -->

        <div style="
        display:flex;
        justify-content:space-between;
        margin-bottom:10px;
        color:#8FA7C0;
        ">

            <span>Subtotal</span>
            <span id="pos-subtotal">$0</span>

        </div>

        <!-- IVA -->

        <div style="
        display:flex;
        justify-content:space-between;
        margin-bottom:10px;
        color:#8FA7C0;
        ">

            <span>IVA 19%</span>
            <span id="pos-tax">$0</span>

        </div>

        <!-- PROPINA -->

        <div style="
        display:flex;
        justify-content:space-between;
        margin-bottom:18px;
        color:#8FA7C0;
        ">

            <span>Propina</span>
            <span id="pos-tip">$0</span>

        </div>

        <!-- TOTAL -->

        <div style="
        display:flex;
        justify-content:space-between;
        align-items:center;
        margin-bottom:22px;
        ">

            <span style="
            font-size:18px;
            font-weight:700;
            ">
                TOTAL
            </span>

            <span
            id="pos-total"
            style="
            color:#00D4FF;
            font-size:30px;
            font-weight:800;
            ">
                $0
            </span>

        </div>

        <!-- PAYMENT METHODS -->

        <div style="
        display:grid;
        grid-template-columns:1fr 1fr 1fr;
        gap:10px;
        margin-bottom:18px;
        ">

            <button style="
            background:#00D4FF;
            color:black;
            border:none;
            border-radius:14px;
            padding:14px;
            font-weight:700;
            cursor:pointer;
            ">
                💵
            </button>

            <button style="
            background:#111C2D;
            color:white;
            border:1px solid rgba(255,255,255,.06);
            border-radius:14px;
            padding:14px;
            cursor:pointer;
            ">
                💳
            </button>

            <button style="
            background:#111C2D;
            color:white;
            border:1px solid rgba(255,255,255,.06);
            border-radius:14px;
            padding:14px;
            cursor:pointer;
            ">
                📱
            </button>

        </div>

        <!-- COBRAR -->

        <button
        id="pos-checkout-button"
        type="button"
        style="
        width:100%;
        height:62px;
        border:none;
        border-radius:18px;
        background:linear-gradient(135deg,#00D4FF,#00FFC6);
        color:black;
        font-size:20px;
        font-weight:800;
        cursor:pointer;
        box-shadow:0 10px 30px rgba(0,212,255,.25);
        ">

            COBRAR

        </button>

    </div>

</aside>
