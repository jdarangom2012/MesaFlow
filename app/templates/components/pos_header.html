<header style="
height:72px;
background:#0B1726;
border-bottom:1px solid rgba(0,212,255,.10);
display:flex;
align-items:center;
justify-content:space-between;
padding:0 22px;
">

    <!-- LEFT -->

    <div style="
    display:flex;
    align-items:center;
    gap:14px;
    ">

        <input type="text"
               placeholder="Buscar producto..."
               style="
               width:320px;
               height:44px;
               border:none;
               outline:none;
               border-radius:12px;
               background:#111C2D;
               color:white;
               padding:0 16px;
               font-size:14px;
               ">

    </div>

    <!-- CENTER -->

    <div style="
    display:flex;
    align-items:center;
    gap:10px;
    ">

        <div style="
        background:#111C2D;
        border:1px solid rgba(0,212,255,.18);
        color:#00D4FF;
        padding:10px 14px;
        border-radius:12px;
        font-size:13px;
        font-weight:600;
        ">
            ⊚ Mesa 5
        </div>

        <div style="
        background:#111C2D;
        border:1px solid rgba(0,255,198,.18);
        color:#00FFC6;
        padding:10px 14px;
        border-radius:12px;
        font-size:13px;
        font-weight:600;
        ">
            👥 4 personas
        </div>

        <div style="
        background:#111C2D;
        border:1px solid rgba(255,193,7,.18);
        color:#FFC107;
        padding:10px 14px;
        border-radius:12px;
        font-size:13px;
        font-weight:600;
        ">
            ⏱ 13:03
        </div>

    </div>

    <!-- RIGHT -->

    <div style="
    display:flex;
    align-items:center;
    gap:12px;
    ">

        <button style="
        background:#111C2D;
        border:1px solid rgba(255,255,255,.06);
        color:#8FA7C0;
        padding:12px 18px;
        border-radius:12px;
        cursor:pointer;
        ">
            Descuento
        </button>

        <button style="
        background:#111C2D;
        border:1px solid rgba(255,255,255,.06);
        color:#8FA7C0;
        padding:12px 18px;
        border-radius:12px;
        cursor:pointer;
        ">
            Split
        </button>

        <button style="
        background:rgba(255,59,92,.08);
        border:1px solid rgba(255,59,92,.22);
        color:#FF5B6E;
        padding:12px 18px;
        border-radius:12px;
        cursor:pointer;
        ">
            Anular
        </button>

    </div>

</header>
