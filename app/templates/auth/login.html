<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MesaFlow Login</title>
    <style>
        :root {
            --bg: #07111F;
            --panel: #0B1726;
            --card: #111C2D;
            --line: rgba(0, 212, 255, .14);
            --cyan: #00D4FF;
            --mint: #00FFC6;
            --text: #F4FAFF;
            --muted: #8FA7C0;
            --danger: #FF5B6E;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 18px;
            background: var(--bg);
            color: var(--text);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .login-card {
            width: min(100%, 420px);
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 24px;
        }

        .brand {
            font-size: 28px;
            font-weight: 950;
            letter-spacing: -.04em;
        }

        .brand span {
            color: var(--cyan);
        }

        .subtitle {
            margin: 8px 0 24px;
            color: var(--muted);
            font-size: 14px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: var(--muted);
            font-size: 12px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: .06em;
        }

        input {
            width: 100%;
            height: 48px;
            margin-bottom: 16px;
            border: 1px solid rgba(255, 255, 255, .07);
            border-radius: 8px;
            outline: none;
            background: var(--card);
            color: var(--text);
            padding: 0 14px;
            font-size: 15px;
        }

        input:focus {
            border-color: rgba(0, 212, 255, .44);
        }

        button {
            width: 100%;
            height: 52px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: linear-gradient(135deg, var(--cyan), var(--mint));
            color: #07111F;
            font-size: 16px;
            font-weight: 950;
        }

        .error {
            margin-bottom: 16px;
            padding: 11px 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 91, 110, .24);
            background: rgba(255, 91, 110, .08);
            color: var(--danger);
            font-size: 13px;
        }
    </style>
</head>
<body>
    <main class="login-card">
        <div class="brand">Mesa<span>Flow</span></div>
        <div class="subtitle">Ingresa a tu operación de restaurante.</div>

        {% if form.errors %}
            <div class="error">Usuario o contraseña inválidos.</div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            {% if next %}
                <input type="hidden" name="next" value="{{ next }}">
            {% endif %}

            <label for="{{ form.username.id_for_label }}">Usuario</label>
            {{ form.username }}

            <label for="{{ form.password.id_for_label }}">Contraseña</label>
            {{ form.password }}

            <button type="submit">Entrar</button>
        </form>
    </main>
</body>
</html>
